name: build

on:
  workflow_dispatch:
    inputs:
      iosevka:
        description: "Iosevka tag (leave blank to use the default in config)"
        required: false
      wenkai_gb:
        description: "LXGW WenKai GB tag"
        required: false
      zhenkai:
        description: "LXGW ZhenKai tag"
        required: false
      release:
        description: "Create a release after the build completes"
        type: boolean
        default: false
  workflow_call:
    inputs:
      iosevka: { type: string, required: false }
      wenkai_gb: { type: string, required: false }
      zhenkai: { type: string, required: false }
      release: { type: boolean, required: false, default: false }
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/build.yml"

concurrency:
  # Allow only one build for the same upstream version combination.
  group: build-${{ github.ref }}-${{ inputs.iosevka || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MOKAI_IOSEVKA_TAG: ${{ inputs.iosevka }}
      MOKAI_WENKAI_TAG: ${{ inputs.wenkai_gb }}
      MOKAI_ZHENKAI_TAG: ${{ inputs.zhenkai }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk woff2
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare font-patcher (pinned version and digest)
        run: |
          # Pin the Docker image by digest and FontPatcher.zip by SHA-256.
          docker pull nerdfonts/patcher@sha256:5afde49c2b29eb5628bcae0b5e814acc32d39335631228d6532455f9dbe02d3a
          mkdir -p work/upstream/fontpatcher
          curl -sSL -o fp.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/FontPatcher.zip
          echo "42bcb32145499a35732274c7fc48deb434ad0d2e0e118f98527c1479c6fa251a  fp.zip" | sha256sum -c -
          unzip -o -q fp.zip -d work/upstream/fontpatcher

      - name: Cache upstream artifacts
        uses: actions/cache@v4
        with:
          path: |
            work/upstream/*.zip
            work/upstream/*.ttf
            work/upstream/iosevka*
            work/upstream/unhinted-*
          key: upstream-${{ inputs.iosevka || 'v34.8.1' }}-${{ inputs.wenkai_gb || 'v1.522' }}-${{ inputs.zhenkai || 'v0.825' }}

      - name: Download upstream artifacts
        run: python src/build.py fetch

      - name: Fetch upstream licenses
        run: python src/build.py licenses

      - name: Prune skeletons and merge CJK glyphs
        run: python src/build.py merge

      - name: Patch with Nerd Fonts
        env:
          # Use the pinned official image to avoid system FontForge drift.
          # Keep the outer pool at two workers and the Docker patcher at PN=1
          # to avoid nested parallelism and out-of-memory failures.
          MOKAI_PATCHER_MODE: docker
          MOKAI_PATCH_JOBS: "2"
        run: |
          mkdir -p out work/patched
          python src/build.py patch

      - name: Package fonts
        run: python src/build.py package

      - name: Generate specimens
        run: |
          for sp in slab slab-nl term term-nl; do
            python src/build.py specimen --spacing "$sp"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mokai-mono-${{ github.run_number }}
          path: |
            out/*.zip
            out/*.sha256
            work/specimen/*.png
          retention-days: 30

      - name: Create release
        if: inputs.release == true || inputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ github.run_number }}-io${{ inputs.iosevka || '34.8.1' }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            out/*.zip out/*.sha256 work/specimen/*.png

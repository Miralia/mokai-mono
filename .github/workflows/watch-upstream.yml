name: watch-upstream

# Automatically trigger a build when an upstream project publishes a release.
#
# The three upstream repositories do not provide webhooks, so this workflow
# polls the Releases API. Authenticated requests allow 5,000 calls/hour;
# anonymous requests allow only 60 calls/hour, so a token is required.

on:
  schedule:
    - cron: "0 3 * * *"        # Daily at 03:00 UTC (11:00 Beijing time).
  workflow_dispatch:

permissions:
  contents: write              # Update upstream.lock.json.
  actions: write               # Trigger the build workflow.

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the latest upstream releases
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest() {
            curl -sSL --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$1/releases/latest" \
            | jq -r '.tag_name'
          }
          # releases/latest skips pre-releases (-rc / -beta), which is what
          # we want: track stable releases by default.
          echo "iosevka=$(latest be5invis/Iosevka)"   >> "$GITHUB_OUTPUT"
          echo "wenkai_gb=$(latest lxgw/LxgwWenKaiGB)" >> "$GITHUB_OUTPUT"
          echo "zhenkai=$(latest lxgw/LxgwZhenKai)"   >> "$GITHUB_OUTPUT"

      - name: Compare with the version lock
        id: diff
        env:
          NEW_IOSEVKA: ${{ steps.upstream.outputs.iosevka }}
          NEW_WENKAI_GB: ${{ steps.upstream.outputs.wenkai_gb }}
          NEW_ZHENKAI: ${{ steps.upstream.outputs.zhenkai }}
        run: |
          set -euo pipefail
          lock=config/upstream.lock.json
          changed=false
          report=""
          compare() {
            local key="$1"; local new="$2"
            local old
            old=$(jq -r ".$key" "$lock")
            if [ "$old" != "$new" ]; then
              changed=true
              report="$report- **$key**: \`$old\` -> \`$new\`"$'\n'
            fi
          }
          compare iosevka "$NEW_IOSEVKA"
          compare wenkai_gb "$NEW_WENKAI_GB"
          compare zhenkai "$NEW_ZHENKAI"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "report<<EOF"
            echo "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stop when unchanged
        if: steps.diff.outputs.changed != 'true'
        run: echo "No upstream updates; skipping."

      - name: Update the version lock
        if: steps.diff.outputs.changed == 'true'
        env:
          NEW_IOSEVKA: ${{ steps.upstream.outputs.iosevka }}
          NEW_WENKAI_GB: ${{ steps.upstream.outputs.wenkai_gb }}
          NEW_ZHENKAI: ${{ steps.upstream.outputs.zhenkai }}
          CHANGE_REPORT: ${{ steps.diff.outputs.report }}
        run: |
          set -euo pipefail
          jq --arg i "$NEW_IOSEVKA" \
             --arg w "$NEW_WENKAI_GB" \
             --arg z "$NEW_ZHENKAI" \
             '.iosevka=$i | .wenkai_gb=$w | .zhenkai=$z' \
             config/upstream.lock.json > lock.tmp
          mv lock.tmp config/upstream.lock.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/upstream.lock.json
          git commit -m "chore: update upstream versions" -m "$CHANGE_REPORT"
          git push

      - name: Trigger the build
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_IOSEVKA: ${{ steps.upstream.outputs.iosevka }}
          NEW_WENKAI_GB: ${{ steps.upstream.outputs.wenkai_gb }}
          NEW_ZHENKAI: ${{ steps.upstream.outputs.zhenkai }}
        run: |
          gh workflow run build.yml \
            -f iosevka="$NEW_IOSEVKA" \
            -f wenkai_gb="$NEW_WENKAI_GB" \
            -f zhenkai="$NEW_ZHENKAI" \
            -f release=true
